<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiếng Việt Drill</title>
<meta name="description" content="Active-recall practice for Vietnamese phrases: TELEX hints, text-to-speech and voice input. Available in 11 languages.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23da251d'/><text x='50' y='72' font-size='72' text-anchor='middle' fill='%23ffcd00'>★</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>

<main class="stage">
  <section class="card" id="card">

    <!-- イメージ画像 -->
    <figure class="art" id="art">
      <div class="art-scene" id="artScene"></div>
      <figcaption class="art-caption" id="artCaption"></figcaption>
    </figure>

    <!-- ベトナム語フレーズ（アクティブリコールのため遅れて表示） -->
    <div class="phrase-zone">
      <div class="recall" id="recall">
        <div class="recall-ring">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <circle class="ring-bg" cx="24" cy="24" r="20"></circle>
            <circle class="ring-fg" id="ringFg" cx="24" cy="24" r="20"></circle>
          </svg>
          <span class="recall-count" id="recallCount">5</span>
        </div>
        <div class="recall-text">
          <strong data-i18n="recallTitle"></strong>
          <span data-i18n="recallSub"></span>
        </div>
        <button class="ghost-btn" id="btnRevealNow" data-i18n="revealNow"></button>
      </div>

      <p class="phrase" id="phrase" dir="ltr" hidden></p>
    </div>

    <!-- 訳 -->
    <div class="meaning">
      <p class="ja" id="ja"></p>
    </div>

    <!-- 品詞分解 + 説明 -->
    <div class="breakdown blurred" id="breakdown">
      <ul class="words" id="words"></ul>
      <p class="note" id="note"></p>
    </div>

    <!-- 入力（スクロール中は画面下部に貼り付く） -->
    <div class="input-dock">
      <div class="input-row">
        <input id="answer" class="answer" type="text" autocomplete="off" autocorrect="off" dir="ltr"
               autocapitalize="off" spellcheck="false" data-i18n-attr="placeholder:answerPlaceholder,aria-label:answerLabel">
        <button class="mic-btn" id="btnMic" data-i18n-attr="title:micLabel,aria-label:micLabel">🎤</button>
      </div>
      <div class="telex-hint" id="telexHint" dir="ltr" hidden>
        <span class="telex-hint-label">TELEX</span>
        <code class="telex-seq" id="telexSeq"></code>
      </div>
      <div class="input-foot">
        <div class="input-status" id="inputStatus"></div>
        <button class="icon-btn" id="btnSettings" data-i18n-attr="title:settingsLabel,aria-label:settingsLabel">⚙️</button>
      </div>
    </div>

  </section>
</main>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<!-- 起動ゲート（音声再生・マイク利用にはユーザー操作が必要） -->
<div class="gate" id="gate">
  <div class="gate-inner">
    <span class="flag gate-mark" aria-hidden="true">★</span>
    <h2 data-i18n="gateTitle"></h2>
    <ol class="gate-steps">
      <li data-i18n="step1"></li>
      <li data-i18n="step2"></li>
      <li data-i18n="step3"></li>
      <li data-i18n="step4"></li>
      <li data-i18n="step5"></li>
      <li data-i18n="step6"></li>
    </ol>
    <label class="gate-lang">
      <span data-i18n="setLang"></span>
      <select id="gateLang"></select>
    </label>
    <button class="primary-btn big" id="btnStart" data-i18n="start"></button>
    <p class="gate-note"><span data-i18n="gateNote1"></span><br><span data-i18n="gateNote2"></span></p>
  </div>
</div>

<!-- 設定ダイアログ -->
<dialog class="sheet" id="settings">
  <form method="dialog">
    <h2 data-i18n="setTitle"></h2>

    <div class="field">
      <span data-i18n="setLang"></span>
      <select id="setLangSelect"></select>
    </div>

    <label class="field">
      <span><span data-i18n="setDelay"></span><em id="lblDelay"></em></span>
      <input type="range" id="setDelay" min="0" max="15" step="1">
    </label>

    <label class="field">
      <span><span data-i18n="setRate1"></span><em id="lblRate1"></em></span>
      <input type="range" id="setRate1" min="0.5" max="1.2" step="0.05">
    </label>

    <label class="field">
      <span><span data-i18n="setRate2"></span><em id="lblRate2"></em></span>
      <input type="range" id="setRate2" min="0.3" max="1" step="0.05">
    </label>

    <label class="check"><input type="checkbox" id="setTelex"> <span data-i18n="setTelex"></span></label>
    <label class="check"><input type="checkbox" id="setAutoSpeak"> <span data-i18n="setAutoSpeak"></span></label>
    <label class="check"><input type="checkbox" id="setAutoListen"> <span data-i18n="setAutoListen"></span></label>
    <label class="check"><input type="checkbox" id="setVoiceAdvance"> <span data-i18n="setVoiceAdvance"></span></label>
    <label class="check"><input type="checkbox" id="setShuffle"> <span data-i18n="setShuffle"></span></label>

    <div class="field">
      <span data-i18n="setVoice"></span>
      <select id="setVoice"></select>
    </div>

    <div class="sheet-actions">
      <button class="ghost-btn" id="btnReset" type="button" data-i18n="reset"></button>
      <button class="primary-btn" value="close" data-i18n="close"></button>
    </div>
  </form>
</dialog>

<script src="js/i18n.js"></script>
<script src="js/telex.js"></script>
<script src="js/data.js"></script>
<script src="js/speech.js"></script>
<script src="js/app.js"></script>
</body>
</html>
