<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>Redirecting to Tiếng Việt Drill</title>
<link rel="canonical" href="https://hocviet.vn/">
<!-- JS が無くてもトップへ飛ばす（JS があれば下のスクリプトが即座に飛ばす） -->
<meta http-equiv="refresh" content="0; url=/">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="styles.css">
<script>
  // ?lang= などのクエリは引き継ぐ。replace なので戻るボタンでループしない
  location.replace('/' + (location.search || ''));
</script>
</head>
<body>

<main class="stage">
  <section class="card notfound">
    <span class="flag gate-mark" aria-hidden="true">★</span>
    <h1>Page not found</h1>
    <p>Taking you to <b lang="vi">Tiếng Việt Drill</b>…</p>
    <p><a class="ghost-btn" href="/">Go to the drill</a></p>
  </section>
</main>

</body>
</html>
